<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Abastecimento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Editar Abastecimento</h2>
        <form method="post">
            <label for="data">Data:</label>
            <input type="date" id="data" name="data" value="{{ registro.data }}" required>

            <label for="onibus">Ônibus:</label>
            <input id="onibus" name="onibus" value="{{ registro.onibus }}" required>

            <label for="litros">Litros:</label>
            <input type="number" step="0.01" id="litros" name="litros" value="{{ registro.litros }}" required>

            <label for="responsavel">Responsável:</label>
            <input id="responsavel" name="responsavel" value="{{ registro.responsavel }}" required>

            <button type="submit">Salvar Alterações</button>
        </form>
        <a href="/dashboard">← Voltar ao Dashboard</a>
    </div>
</body>
</html>
